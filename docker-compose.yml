# This project's OWN Postgres + Redis for local development — matching the
# Collings stack (Postgres), but a separate database on a non-default host port
# so it never clashes with any other project's DB/Redis on your machine.
#
# The backend also runs without these (SQLite + in-memory channel layer) for a
# zero-setup first look; bring these up for a prod-like setup.
services:
  db:
    image: postgres:16
    container_name: collings-ticketing-db
    environment:
      POSTGRES_USER: collings_ticketing
      POSTGRES_PASSWORD: collings_ticketing
      POSTGRES_DB: collings_ticketing
    ports:
      - "5433:5432" # host 5433 -> container 5432 (5432 left free for other DBs)
    volumes:
      - ticketing_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collings_ticketing"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    container_name: collings-ticketing-redis
    ports:
      - "6380:6379" # host 6380 -> container 6379

volumes:
  ticketing_pgdata:
